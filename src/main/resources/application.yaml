quarkus:
  application:
    name: ${project.artifactId}
    version: ${project.version}

  banner:
    enabled: true

  default-locale: pt_BR

  http:
    port: 8080

  security:
    jaxrs:
      deny-unannotated-endpoints: true

  devservices:
    enabled: false

  # POSTGRES_SSLMODE controla a criptografia do transporte. O default `disable` serve o
  # Postgres local do docker compose, que não fala TLS. O RDS recusa conexão em claro
  # (rds.force_ssl é padrão no Postgres 16), então lá o ConfigMap manda `require`.
  datasource:
    username: ${POSTGRES_USERNAME:admin}
    password: ${POSTGRES_PASSWORD:changeme}
    jdbc:
      url: jdbc:postgresql://${INFRA_HOST_POSTGRES:localhost}/${POSTGRES_DB:oficina}?currentSchema=oficina_mecanica&sslmode=${POSTGRES_SSLMODE:disable}
    reactive:
      url: postgresql://${INFRA_HOST_POSTGRES:localhost}/${POSTGRES_DB:oficina}?search_path=oficina_mecanica&sslmode=${POSTGRES_SSLMODE:disable}
      # Acompanha POSTGRES_SSLMODE: sem isto o cliente reativo valida a cadeia do
      # certificado e o handshake com o RDS falha, porque a CA da AWS não está no
      # truststore da JVM. Equipara o comportamento ao do JDBC, cujo `sslmode=require`
      # também cifra sem validar. O default `false` mantém a validação ligada para
      # quem apontar a aplicação a um servidor com certificado confiável.
      trust-all: ${POSTGRES_TRUST_ALL:false}

  hibernate-orm:
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    schema-management:
      strategy: update
    database:
      default-schema: oficina_mecanica
    log:
      sql: false
      format-sql: true

  flyway:
    migrate-at-start: true

  otel:
    sdk:
      disabled: true
    exporter:
      otlp:
        traces:
          endpoint: http://${INFRA_HOST_OTEL:localhost:4317}
        metrics:
          endpoint: http://${INFRA_HOST_OTEL:localhost:4317}
        logs:
          endpoint: http://${INFRA_HOST_OTEL:localhost:4317}
    traces:
      sampler: parentbased_always_on
    metrics:
      enabled: true
    logs:
      enabled: true
    resource:
      attributes:
        - "service.name=${quarkus.application.name}"
        - "service.version=${quarkus.application.version}"

  log:
    console:
      format: "%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] req=%X{requestId} trace=%X{traceId} span=%X{spanId} %s%e%n"

  # ── OpenAPI / Swagger UI ──────────────────────────────────────────────────--
  smallrye-openapi:
    path: /q/openapi                 # spec at /q/openapi (JSON) and /q/openapi?format=yaml
    info-title: Mechanic Workshop API
    info-version: ${project.version}
    info-description: Mechanic workshop management API (16SOAT - Tech Challenge Phase 1)
    info-license-name: Apache 2.0
    info-license-url: https://www.apache.org/licenses/LICENSE-2.0.html
    # Bearer JWT scheme — enables the "Authorize" button in Swagger UI and adds
    # the security requirement to operations automatically (auto-add-security).
    security-scheme: jwt
    security-scheme-name: bearerAuth
    security-scheme-description: Provide the JWT token obtained from the login endpoint.

  swagger-ui:
    path: /q/swagger-ui
    title: Mechanic Workshop API
    # By default Swagger UI is only served in dev/test. Kept accessible also in the
    # packaged artifact during the development phase; in production set
    # SWAGGER_UI_ENABLED=false to avoid exposing the API surface (OWASP).
    always-include: ${SWAGGER_UI_ENABLED:true}


# ── JWT ─────────────────────────────────────────────────────────────────────--
# The RS256 pair is never versioned nor baked into the image: it is generated once,
# outside the build (infra/scripts/generate-jwt-pair.sh), and provided by
# JWT_PRIVATE_KEY_LOCATION / JWT_PUBLIC_KEY_LOCATION — a mounted secret in production
# (e.g.: file:/etc/jwt/privateKey.pem), a Docker volume under docker compose.
# The defaults below point to the local development pair, which is not tracked by Git;
# JwtKeyStartupGuard refuses to start in production while they are in use.
smallrye:
  jwt:
    sign:
      key:
        location: ${JWT_PRIVATE_KEY_LOCATION:.local-jwt/privateKey.pem}

mp:
  jwt:
    verify:
      issuer: ${JWT_ISSUER:oficina-api}
      publickey:
        location: ${JWT_PUBLIC_KEY_LOCATION:.local-jwt/publicKey.pem}

app:
  seed:
    admin-username: ${APP_SEED_ADMIN_USERNAME:admin}
    admin-password: ${APP_SEED_ADMIN_PASSWORD:}
    mechanic-username: ${APP_SEED_MECHANIC_USERNAME:mecanico}
    mechanic-password: ${APP_SEED_MECHANIC_PASSWORD:}
  jwt:
    expiration-hours: ${JWT_EXPIRATION_HOURS:8}

# ── Test profile ──────────────────────────────────────────────────────────────
# Applied automatically by @QuarkusTest (profile = "test").
# Quarkus DevServices spins up a real PostgreSQL container via Testcontainers.
# No mocks — the full stack (HTTP → Service → Repository → PostgreSQL) is tested.
# Requires Docker to be running.
"%test":
  quarkus:
    devservices:
      enabled: true          # re-enables Testcontainers for the test profile

    datasource:
      db-kind: postgresql
      devservices:
        init-script-path: db/init.sql    # creates the "oficina_mecanica" schema before Hibernate runs

    hibernate-orm:
      physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
      schema-management:
        strategy: drop-and-create        # Hibernate drops/creates tables on every test run
      database:
        default-schema: oficina_mecanica
      log:
        sql: true

    log:
      console:
        format: "%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] %s%e%n"
