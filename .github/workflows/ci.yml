name: Workflow CI

# Pipeline de validação para PRs — roda apenas CI, sem deploy.
# Usado para validar qualidade antes do merge na main.

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip unit tests during build"
        type: boolean
        default: false

  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths-ignore:
      - "**/*.md"

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.event.repository.name }}-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Detecção de secrets no histórico do repositório ──────────────────────
  secrets_gitleaks:
    name: Secrets Scan (Gitleaks)
    uses: 15SOAT-JVGG/reusable-workflows/.github/workflows/security-gitleaks.yml@main
    with:
      gitleaks_version: "8.24.3"
      fetch_depth: 0
      block_on_manual: false
      upload_sarif: false

  # ── 2. SAST — análise estática de segurança ──────────────────────────────────
  sast_semgrep:
    name: SAST (Semgrep)
    uses: 15SOAT-JVGG/reusable-workflows/.github/workflows/security-semgrep.yml@main
    secrets: inherit
    with:
      config: p/ci
      fail_on_findings: true
      upload_sarif: false

  # ── 3. Build & Testes — Quarkus JVM ──────────────────────────────────────────
  build:
    name: Build & Tests (Quarkus JVM)
    needs: [secrets_gitleaks, sast_semgrep]
    uses: 15SOAT-JVGG/reusable-workflows/.github/workflows/build-java-quarkus-jvm.yml@main
    with:
      java_version: "21"
      use_tailscale: false
      upload_coverage: ${{ inputs.skip_tests != true }}
      maven_goals: "verify"
      maven_args: ${{ inputs.skip_tests == true && '-DskipTests -Dstyle.color=always' || '-Pitest -Dstyle.color=always' }}

  # ── 4. SCA — varredura de dependências com OWASP Dependency-Check ────────────
  sca_dependency_check:
    name: SCA (OWASP Dependency-Check)
    needs: [build]
    uses: 15SOAT-JVGG/reusable-workflows/.github/workflows/security-sca-dependency-check.yml@main
    with:
      project_name: ${{ github.event.repository.name }}
      scan_path: .
      fail_cvss: "8"
      format: "HTML"
      upload_artifact: true
