services:

  postgres:
    image: postgres:16
    container_name: oficina-mecanica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-oficina}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-admin} -d ${POSTGRES_DB:-oficina}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oficina_mecanica_net

  srv-oficina-mecanica:
    # Para uso local: rode ./mvnw package -DskipTests antes de subir o Compose.
    # O Dockerfile multistage (infra/docker/Dockerfile) é usado pelo CI, que tem
    # acesso ao Nexus interno. Aqui usamos o Dockerfile simples que copia os
    # artefatos já compilados.
    build:
      context: ../../../..
      dockerfile: src/main/docker/Dockerfile
    image: ghcr.io/15soat-jvgg/fiap-srv-oficina-mecanica:${CUSTOMER_VERSION:-local}
    container_name: srv-oficina-mecanica
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"
      - "8090:8090"

    environment:
      INFRA_HOST_POSTGRES: oficina-mecanica-postgres
      POSTGRES_DB: ${POSTGRES_DB:-oficina}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

    networks:
      - oficina_mecanica_net

networks:
  oficina_mecanica_net:
    driver: bridge

volumes:
  postgres_data: