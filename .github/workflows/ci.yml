name: Workflow CI

# Pipeline de validação para PRs — roda apenas CI, sem deploy.
# Usado para validar qualidade antes do merge na main.

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip unit tests during build"
        type: boolean
        default: false

  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths-ignore:
      - "**/*.md"

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.event.repository.name }}-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Detecção de secrets no histórico do repositório ──────────────────────
  secrets_gitleaks:
    name: Secrets Scan (Gitleaks)
    uses: 15SOAT-JVGG/reusable-workflows/.github/workflows/security-gitleaks.yml@main
    with:
      gitleaks_version: "8.24.3"
      fetch_depth: 0
      block_on_manual: false
      upload_sarif: false

  # ── 2. SAST — análise estática de segurança ──────────────────────────────────
  sast_semgrep:
    name: SAST (Semgrep)
    uses: 15SOAT-JVGG/reusable-workflows/.github/workflows/security-semgrep.yml@main
    secrets: inherit
    with:
      config: p/ci
      fail_on_findings: true
      upload_sarif: false

  # ── 3. Build & Testes — Quarkus JVM ──────────────────────────────────────────
  build:
    name: Build & Tests (Quarkus JVM)
    needs: [secrets_gitleaks, sast_semgrep]
    uses: 15SOAT-JVGG/reusable-workflows/.github/workflows/build-java-quarkus-jvm.yml@main
    with:
      java_version: "21"
      use_tailscale: false
      upload_coverage: ${{ inputs.skip_tests != true }}
      maven_goals: "verify"
      maven_args: ${{ inputs.skip_tests == true && '-DskipTests -Dstyle.color=always' || '-Dstyle.color=always' }}

  # ── 4. IaC — sintaxe da infraestrutura e dos manifestos, sem tocar em nuvem ──
  iac_validate:
    name: IaC Validation (Terraform + Kubernetes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TERRAFORM_VERSION: "1.16.0"
      # Acompanha o `kubernetes_version` do control plane em
      # infra/terraform/variables.tf; o patch vem porque o schema é publicado por
      # versão exata. É contra ele que os manifestos são validados.
      KUBERNETES_VERSION: "1.33.4"
    steps:
      - uses: actions/checkout@v4

      - name: Instala o Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Formatação do HCL
        run: terraform -chdir=infra/terraform fmt -check -recursive -diff

      # -backend=false é o que mantém a validação fora da nuvem: sem state remoto e
      # sem credencial da AWS, só os providers e a checagem de tipos do HCL.
      - name: Sintaxe do HCL
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate

      - name: Instala o kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v${{ env.KUBERNETES_VERSION }}

      - name: Renderiza os manifestos
        run: kubectl kustomize k8s/ > rendered-manifests.yaml

      # kubectl apply --dry-run=client precisaria falar com um servidor de API para
      # validar campo; o kubeconform valida contra o schema da versão do cluster
      # offline, e -strict recusa campo desconhecido em vez de ignorá-lo.
      - name: Schema dos manifestos
        run: |
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary -kubernetes-version "$KUBERNETES_VERSION" - < rendered-manifests.yaml

  # ── 5. SCA — varredura de dependências com OWASP Dependency-Check ────────────
  sca_dependency_check:
    name: SCA (OWASP Dependency-Check)
    needs: [build]
    uses: 15SOAT-JVGG/reusable-workflows/.github/workflows/security-sca-dependency-check.yml@main
    with:
      project_name: ${{ github.event.repository.name }}
      scan_path: .
      fail_cvss: "8"
      format: "HTML"
      upload_artifact: true

  # ── 6. Qualidade de código — SonarQube (via Tailscale) ───────────────────────
  sonar:
    name: SonarQube Scan
    needs: [sca_dependency_check]
    if: ${{ inputs.skip_tests != true }}
    uses: 15SOAT-JVGG/reusable-workflows/.github/workflows/quality-sonarqube-scan.yml@main
    with:
      environment_name: homelab
      fetch_depth: 0
      coverage_artifact: ${{ inputs.skip_tests == true && '' || 'coverage-xml' }}
      coverage_path: target/jacoco-report
      sonar_enabled: false
      sonar_project_key: ${{ github.event.repository.name }}
      wait_quality_gate: true
      tailscale_tags: tag:github-actions-homelab
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
