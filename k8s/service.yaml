apiVersion: v1
kind: Service
metadata:
  name: oficina-mecanica-api
  namespace: oficina-mecanica
  labels:
    app.kubernetes.io/name: oficina-mecanica-api
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: oficina-mecanica-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: management
      port: 8090
      targetPort: management
      protocol: TCP
