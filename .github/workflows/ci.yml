name: Workflow CI

# Pipeline de validação para PRs — roda apenas CI, sem deploy.
# Usado para validar qualidade antes do merge na main.
#
# Todos os jobs são locais, de propósito. A versão anterior deste arquivo chamava
# workflows compartilhados de 15SOAT-JVGG/reusable-workflows, que é privado e cujo acesso
# não está liberado para este repositório: `uses` de workflow inacessível reprova a
# execução inteira em segundos, antes de qualquer job começar, e por isso nenhum PR desta
# fase chegou a ser validado. O deploy.yml já havia trilhado esse caminho para o gate de
# qualidade; aqui o resto acompanha.
#
# Dois jobs da versão anterior não sobreviveram à mudança, e é uma perda consciente:
#
#   SonarQube      já vinha com `sonar_enabled: false` e aponta para um servidor de
#                  homelab alcançável só por Tailscale — fora deste repositório, não
#                  havia o que executar.
#   Dependency-Check  a varredura de dependências precisa da base da NVD, e sem chave de
#                  API nem cache entre execuções ela leva dezenas de minutos e é limitada
#                  por taxa. O retrato mais recente está em
#                  docs/RELATORIO-VULNERABILIDADES.md.

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip unit tests during build"
        type: boolean
        default: false

  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.event.repository.name }}-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Detecção de secrets no histórico do repositório ──────────────────────
  #
  # `--no-git` ficaria só na árvore de trabalho; o valor está justamente em varrer o
  # histórico, onde um segredo removido continua recuperável. Por isso fetch-depth: 0.
  secrets_gitleaks:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Varre o histórico
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 \
            detect --source=/repo --redact --verbose

  # ── 2. SAST — análise estática de segurança ──────────────────────────────────
  sast_semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # `scan` em vez de `ci`: o segundo espera uma conta no Semgrep Cloud para buscar a
      # política do projeto. `--error` é o que transforma achado em reprovação.
      - name: Analisa o código
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.175.0 \
            semgrep scan --config p/ci --error --metrics=off

  # ── 3. Build & Testes — Quarkus JVM ──────────────────────────────────────────
  #
  # `verify` é o gate inteiro num comando: compila, roda os testes, Checkstyle, PMD,
  # SpotBugs, Spotless e o mínimo de cobertura do JaCoCo. É o mesmo comando do job de
  # build do deploy.yml, para que o PR reprove pelo que a entrega reprovaria.
  build:
    name: Build & Tests (Quarkus JVM)
    needs: [secrets_gitleaks, sast_semgrep]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instala o Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, testes e gates de qualidade
        run: ./mvnw --batch-mode verify ${{ inputs.skip_tests && '-DskipTests' || '' }}

      # O relatório é o que permite conferir a cobertura de um PR sem rodar nada local.
      - name: Publica o relatório de cobertura
        if: ${{ !cancelled() && !inputs.skip_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/jacoco-report
          retention-days: 7
          if-no-files-found: warn

  # ── 4. IaC — sintaxe da infraestrutura e dos manifestos, sem tocar em nuvem ──
  iac_validate:
    name: IaC Validation (Terraform + Kubernetes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TERRAFORM_VERSION: "1.16.0"
      # Acompanha o `kubernetes_version` do control plane em
      # infra/terraform/variables.tf; o patch vem porque o schema é publicado por
      # versão exata. É contra ele que os manifestos são validados.
      KUBERNETES_VERSION: "1.33.4"
    steps:
      - uses: actions/checkout@v4

      - name: Instala o Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Formatação do HCL
        run: terraform -chdir=infra/terraform fmt -check -recursive -diff

      # -backend=false é o que mantém a validação fora da nuvem: sem state remoto e
      # sem credencial da AWS, só os providers e a checagem de tipos do HCL.
      - name: Sintaxe do HCL
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate

      - name: Instala o kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v${{ env.KUBERNETES_VERSION }}

      - name: Renderiza os manifestos
        run: kubectl kustomize k8s/ > rendered-manifests.yaml

      # kubectl apply --dry-run=client precisaria falar com um servidor de API para
      # validar campo; o kubeconform valida contra o schema da versão do cluster
      # offline, e -strict recusa campo desconhecido em vez de ignorá-lo.
      - name: Schema dos manifestos
        run: |
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary -kubernetes-version "$KUBERNETES_VERSION" - < rendered-manifests.yaml
