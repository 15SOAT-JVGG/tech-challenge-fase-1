sonar.projectKey=fiap-srv-oficina-mecanica
sonar.projectName=fiap-srv-oficina-mecanica
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.libraries=target/quarkus-app/lib
sonar.coverage.jacoco.xmlReportPaths=target/jacoco-report/jacoco.xml

# Exclude DTOs from static analysis and coverage reports. Adjust patterns if
# you prefer to exclude only specific DTOs or packages.
sonar.exclusions=src/main/java/**/dto/**,src/main/java/**/*DTO.java
sonar.coverage.exclusions=src/main/java/**/dto/**,src/main/java/**/*DTO.java

# S110: exception classes inherit 4 levels from the JDK (Object > Throwable > Exception >
# RuntimeException) before any domain hierarchy starts, so the default limit of 5 is
# routinely exceeded without any design smell. Suppress S110 for exception classes only.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S110
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*Exception.java

