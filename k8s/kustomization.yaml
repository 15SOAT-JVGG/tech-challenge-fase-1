apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: oficina-mecanica

# Os Secrets que o Deployment consome não estão aqui. O porquê e como criá-los estão
# em infra/README.md, na seção "Implantando a aplicação".

images:
  - name: oficina-mecanica
    # Sai de `terraform -chdir=infra/terraform output -raw ecr_repository_url`. Em
    # outra conta o ID muda, como no bucket de state em infra/terraform/versions.tf.
    newName: 059056506203.dkr.ecr.us-east-1.amazonaws.com/oficina-mecanica
    # `latest` é o que faz `kubectl apply -k k8s/` funcionar num checkout limpo, e é
    # por isso que o Deployment pede imagePullPolicy: Always. Como a tag não muda, o
    # apply sozinho não dispara rollout — o caminho manual fecha com um
    # `kubectl rollout restart`. O caminho de entrega troca esta tag pelo SHA do commit
    # (`kustomize edit set image`, em .github/workflows/deploy.yml), e aí o rollout vem
    # do próprio apply.
    newTag: latest
