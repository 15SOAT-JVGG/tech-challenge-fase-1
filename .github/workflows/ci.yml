name: Workflow CI

# Pipeline de validação para PRs — roda apenas CI, sem deploy.
# Usado para validar qualidade antes do merge na main.

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip unit tests during build"
        type: boolean
        default: false

  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths-ignore:
      - "**/*.md"

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.event.repository.name }}-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Detecção de secrets no histórico do repositório ──────────────────────
  secrets_gitleaks:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.24.3"
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Gitleaks binary
        id: gitleaks-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks-${{ runner.os }}-${{ runner.arch }}-${{ env.GITLEAKS_VERSION }}

      - name: Install Gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64) package_arch="x64" ;;
            aarch64|arm64) package_arch="arm64" ;;
            *) echo "Unsupported runner architecture"; exit 1 ;;
          esac

          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${package_arch}.tar.gz"
          mkdir -p "${HOME}/.local/bin"
          curl --fail --silent --show-error --location "${url}" --output "${archive}"
          tar -xzf "${archive}" -C "${HOME}/.local/bin" gitleaks
          chmod +x "${HOME}/.local/bin/gitleaks"

      - name: Scan complete history for secrets
        run: |
          "${HOME}/.local/bin/gitleaks" detect \
            --config=.gitleaks/gitleaks.toml \
            --redact \
            --exit-code=1 \
            --report-format=sarif \
            --report-path=gitleaks.sarif

      - name: Upload Gitleaks report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-${{ github.sha }}
          path: gitleaks.sarif
          if-no-files-found: warn
          retention-days: 14

  # ── 2. SAST — análise estática de segurança ──────────────────────────────────
  sast_semgrep:
    name: SAST (Semgrep)
    uses: 15SOAT-JVGG/reusable-workflows/.github/workflows/security-semgrep.yml@ecbbbeba3ef6e46082a374d5d918ad40140c144e
    secrets: inherit
    with:
      config: p/ci
      fail_on_findings: true
      upload_sarif: false

  # ── 3. Build & Testes — Quarkus JVM ──────────────────────────────────────────
  build:
    name: Build & Tests (Quarkus JVM)
    needs: [secrets_gitleaks, sast_semgrep]
    uses: 15SOAT-JVGG/reusable-workflows/.github/workflows/build-java-quarkus-jvm.yml@ecbbbeba3ef6e46082a374d5d918ad40140c144e
    with:
      java_version: "21"
      use_tailscale: false
      upload_coverage: ${{ inputs.skip_tests != true }}
      maven_goals: "verify"
      maven_args: ${{ inputs.skip_tests == true && '-DskipTests -Dstyle.color=always' || '-Pitest -Dstyle.color=always' }}

  # ── 4. SCA — varredura de dependências com OWASP Dependency-Check ────────────
  sca_dependency_check:
    name: SCA (OWASP Dependency-Check)
    needs: [build]
    uses: 15SOAT-JVGG/reusable-workflows/.github/workflows/security-sca-dependency-check.yml@ecbbbeba3ef6e46082a374d5d918ad40140c144e
    with:
      project_name: ${{ github.event.repository.name }}
      scan_path: .
      fail_cvss: "8"
      format: "HTML"
      upload_artifact: true
