apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-mecanica
  labels:
    app.kubernetes.io/name: oficina-mecanica
spec:
  # Uma réplica no primeiro deploy é o que deixa o Flyway migrar sem concorrência. O
  # HPA passa a mandar no número de réplicas depois (#35), e o lock da tabela de
  # histórico cobre os deploys seguintes.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oficina-mecanica
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-mecanica
    spec:
      # A imagem já declara USER 185; repetir aqui é o que faz o Kubernetes recusar o
      # pod caso alguém publique uma imagem que voltou a rodar como root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        # Os arquivos de um volume de Secret nascem com dono root. Sem fsGroup, o
        # processo em 185 não lê o par RS256 e o SmallRye rejeita a chave dizendo
        # apenas que a localização é inválida.
        fsGroup: 185
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: oficina-mecanica
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: oficina-mecanica-config
            - secretRef:
                name: oficina-mecanica-env
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/jwt
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # Sem requests o HPA não tem base de cálculo. Os valores cabem duas réplicas
          # com folga num t3.medium (2 vCPU, 4 GiB).
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          # A JVM leva alguns segundos para subir, e a readiness inclui a checagem do
          # Postgres. O startupProbe dá até 2 minutos para isso sem que a liveness
          # comece a matar o pod no meio da inicialização.
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: jwt-keys
          secret:
            secretName: oficina-mecanica-jwt
            defaultMode: 0440
