apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-mecanica-api
  namespace: oficina-mecanica
  labels:
    app.kubernetes.io/name: oficina-mecanica-api
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oficina-mecanica-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-mecanica-api
        app.kubernetes.io/part-of: oficina-mecanica
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        runAsGroup: 185
        fsGroup: 185
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # O workflow substitui latest pela tag GHCR imutavel do commit.
          image: ghcr.io/15soat-jvgg/tech-challenge-fase-1:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 185
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 8090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: oficina-mecanica-config
          env:
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: oficina-mecanica-secrets
                  key: POSTGRES_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-mecanica-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/jwt
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: jwt-keys
          secret:
            secretName: oficina-mecanica-secrets
            items:
              - key: JWT_PRIVATE_KEY
                path: privateKey.pem
              - key: JWT_PUBLIC_KEY
                path: publicKey.pem
            defaultMode: 0440
