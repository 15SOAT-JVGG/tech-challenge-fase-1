name: Workflow Release CI/CD (Homelab)

# ══════════════════════════════════════════════════════════════════════════════
# ── Secrets necessários — environment "homelab" (org → Settings → Environments)
#   PORTAINER_TOKEN        API Key do Portainer  (Portainer → Settings → Users → API keys)
#   TS_OAUTH_CLIENT_ID     OAuth Client ID       (console.tailscale.com → Settings → OAuth clients)
#   TS_OAUTH_CLIENT_SECRET OAuth Client Secret   (mesmo lugar acima)
#   SONAR_TOKEN            Token do SonarQube    (SonarQube → Account → Security)
#   SONAR_HOST_URL         URL do SonarQube      (ex: http://100.x.x.x:9000)
#   NEXUS_USERNAME         Usuário do Nexus      (github-actions)
#   NEXUS_PASSWORD         Senha do Nexus
#
# ── Variables necessárias (repo → Settings → Variables → Actions) ─────────────
#   PORTAINER_URL  URL do Portainer via Tailscale  ex: http://100.x.x.x:9000
#
# ── Variables necessárias (org → Settings → Variables → Actions) ──────────────
#   NEXUS_URL      URL do Nexus via Tailscale        ex: http://100.x.x.x:8081
# ══════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:

  pull_request:
    branches: [main]
    types: [opened, synchronize, closed]
    paths-ignore:
      - "*.md"

  push:
    branches: [main]
    paths-ignore:
      - "*.md"

permissions:
  actions: read
  contents: write         # semantic-release cria releases e commits de changelog
  packages: write         # push de imagem no GHCR
  security-events: write  # upload SARIF (gitleaks)
  issues: write           # semantic-release comenta em issues
  pull-requests: write    # semantic-release comenta em PRs

concurrency:
  group: ${{ github.event.repository.name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  # ── 1. Detecção de secrets no histórico do repositório ──────────────────────
  secrets_gitleaks:
    name: Secrets Scan (Gitleaks)
    uses: airtonlima/reusable-workflows/.github/workflows/security-gitleaks.yml@main
    with:
      gitleaks_version: "8.24.3"
      fetch_depth: 0
      block_on_manual: false
      upload_sarif: false

  # ── 2. SAST — análise estática de segurança ──────────────────────────────────
  sast_semgrep:
    name: SAST (Semgrep)
    uses: airtonlima/reusable-workflows/.github/workflows/security-semgrep.yml@main
    secrets: inherit
    with:
      config: p/ci
      fail_on_findings: true
      upload_sarif: false

  # ── 3. Build & Testes — Quarkus JVM ──────────────────────────────────────────
  #   Conecta ao Tailscale para acessar dependências internas (oficina-mecanica-lib-*) no Nexus.
  build:
    name: Build & Tests (Quarkus JVM)
    needs: [secrets_gitleaks, sast_semgrep]
    uses: airtonlima/reusable-workflows/.github/workflows/build-java-quarkus-jvm.yml@main
    with:
      environment_name: homelab
      java_version: "21"
      use_tailscale: true
      upload_coverage: true
      maven_goals: "verify"
    secrets:
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}

  # ── 4. SCA — varredura de dependências com OWASP Dependency-Check ────────────
  sca_dependency_check:
    name: SCA (OWASP Dependency-Check)
    needs: [build]
    uses: airtonlima/reusable-workflows/.github/workflows/security-sca-dependency-check.yml@main
    with:
      project_name: ${{ github.event.repository.name }}
      scan_path: .
      fail_cvss: "8"
      format: "HTML"
      upload_artifact: true

  # ── 5. Qualidade de código — SonarQube (via Tailscale) ───────────────────────
  sonar:
    name: SonarQube Scan
    needs: [build, secrets_gitleaks, sast_semgrep, sca_dependency_check]
    uses: airtonlima/reusable-workflows/.github/workflows/quality-sonarqube-scan.yml@main
    with:
      environment_name: homelab
      fetch_depth: 0
      coverage_artifact: "coverage-xml"
      coverage_path: target/jacoco-report
      sonar_enabled: true
      sonar_project_key: ${{ github.event.repository.name }}
      wait_quality_gate: true
      tailscale_tags: tag:github-actions-homelab
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}

  # ════════════════════════════════════════════════════════════════════════════
  # CD — apenas em push na main (após merge do PR)
  # ════════════════════════════════════════════════════════════════════════════

  # ── 6. Versão semântica (dry-run) ────────────────────────────────────────────
  version:
    name: Compute Version
    #if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, sonar, sca_dependency_check]
    uses: airtonlima/reusable-workflows/.github/workflows/release-semantic-version.yml@main
    secrets: inherit

  # ── 7. Build & Push da imagem Docker → GHCR ─────────────────────────────────
  docker:
    name: Build & Push Image (GHCR)
    #if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, version]
    uses: airtonlima/reusable-workflows/.github/workflows/docker-build-push-ghcr.yml@main
    with:
      version_tag: ${{ needs.version.outputs.version_tag }}
      dockerfile: infra/docker/Dockerfile
      binaries_artifact: quarkus-jvm-artifacts

  # ── 8. Scan de vulnerabilidades na imagem (Trivy) ────────────────────────────
  image_scan:
    name: Image Scan (Trivy)
    #if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker, version]
    uses: airtonlima/reusable-workflows/.github/workflows/security-trivy-image-scan.yml@main
    with:
      image_ref: ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version_tag }}

  # ── 9. Deploy no Portainer via Tailscale VPN ─────────────────────────────────
  #   O stack no Portainer deve ter a imagem configurada com ${VERSION}:
  #     image: ghcr.io/airtonlima/fiap-srv-oficina-mecanica:${VERSION}
  deploy_dev:
    name: Deploy Dev (Portainer via Tailscale)
    #if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker, image_scan, version]
    uses: airtonlima/reusable-workflows/.github/workflows/deploy-portainer-tailscale.yml@main
    with:
      environment_name: homelab
      portainer_url: ${{ vars.PORTAINER_URL }}
      stack_name: ${{ github.event.repository.name }}
      version: ${{ needs.version.outputs.version_tag }}
      version_env_name: "CUSTOMER_VERSION"
      insecure_tls: true
    secrets:
      PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}

  # ── 10. Publica GitHub Release (apenas quando há nova versão semântica) ───────
  release:
    name: Publish GitHub Release
    #if: >-
    #  github.event_name == 'push' &&
    #  github.ref == 'refs/heads/main' &&
    #  needs.version.outputs.release_needed == 'true'
    needs: [deploy_dev, version]
    uses: airtonlima/reusable-workflows/.github/workflows/release-semantic-publish.yml@main
    secrets: inherit
