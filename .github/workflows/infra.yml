name: Workflow Infra

# Provisionamento da infraestrutura da Fase 2 — cluster EKS, Postgres no RDS e o
# registry da imagem. O disparo é sempre manual: o control plane leva de 15 a 20
# minutos para convergir, as credenciais do Learner Lab expiram em cerca de quatro
# horas, e duas execuções concorrentes disputariam o lock do state (ADR-0003).

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan só mostra o que mudaria; apply aplica exatamente o plano exibido"
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  contents: read

concurrency:
  group: terraform-fase2
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  TERRAFORM_VERSION: "1.16.0"

jobs:

  terraform:
    name: Terraform (${{ inputs.action }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: infra/terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Sessão do lab vencida é o modo de falha mais comum aqui. Falhar em segundos
      # custa menos que descobrir isso no meio de um apply de vinte minutos.
      - name: Confere a sessão do lab
        run: aws sts get-caller-identity

      - name: Instala o Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Inicializa o backend
        run: terraform init

      - name: Valida a configuração
        run: terraform validate

      # O plano vai para arquivo para que o apply aplique exatamente o que foi
      # exibido, em vez de replanejar. O arquivo não é publicado como artefato de
      # propósito: carrega a senha do banco em claro, e artefato é legível por
      # qualquer um com leitura no repo. O resumo abaixo é seguro porque é
      # `terraform show`, que redige valor sensível como `(sensitive value)`.
      - name: Gera o plano
        run: terraform plan -lock-timeout=5m -out=tfplan

      - name: Publica o plano no resumo da execução
        env:
          ACTION: ${{ inputs.action }}
        run: |
          {
            printf '## Plano — %s\n\n' "$ACTION"
            printf '```\n'
            terraform show -no-color tfplan
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      # `destroy` fica de fora deste workflow: é operação de fim de sessão, feita da
      # máquina do operador, e não algo a um clique de distância aqui.
      - name: Aplica o plano exibido
        if: inputs.action == 'apply'
        run: terraform apply -lock-timeout=5m -auto-approve tfplan

      # `terraform output` sem -raw redige a senha do banco como <sensitive>, que é o
      # que permite publicar as saídas inteiras no resumo.
      - name: Publica as saídas do ambiente
        if: inputs.action == 'apply'
        run: |
          {
            printf '## Ambiente\n\n'
            printf '```\n'
            terraform output
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
